# The serversideup nginx default config only matches "*.php" endings, so the PATH_INFO
# style URLs of the /api PHP proxies (/api/tides.php/sites, /api/m.php/s) would 404.
# This location splits the script and its path info and is evaluated before the default
# "\.php$" regex (it is included earlier in the server block).
location ~ ^(/api/.+\.php)(/.*)$ {
    include        fastcgi_params;
    fastcgi_param  SCRIPT_FILENAME  $document_root$1;
    fastcgi_param  SCRIPT_NAME      $1;
    fastcgi_param  PATH_INFO        $2;
    fastcgi_pass   127.0.0.1:9000;
}
