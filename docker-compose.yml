services:
  php:
    image: serversideup/php:8.5-fpm-nginx
    container_name: tidalstreams_php_v1
    restart: unless-stopped
    environment:
      NGINX_WEBROOT: /var/www/html
      SSL_MODE: mixed
      MAREE_API_KEY: ${MAREE_API_KEY:?Set MAREE_API_KEY in .env}
      TIDE_CACHE_DIR: /var/cache/tides
    volumes:
      - ./public_html/:/var/www/html/
      - ./cache/tides/:/var/cache/tides/
      # Adds PATH_INFO routing for /api/*.php/suffix URLs (the default config lacks it)
      - ./docker/server-opts.d:/etc/nginx/server-opts.d/:ro
    ports:
      - 80:8080
      - 443:8443
